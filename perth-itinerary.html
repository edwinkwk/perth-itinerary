<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Perth & Margaret River — Edwin & Family · Jun 2–11, 2026</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.2/babel.min.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { background: #f4f0e8; }
    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-track { background: #ece8e0; }
    ::-webkit-scrollbar-thumb { background: #b0b8c4; border-radius: 3px; }
  </style>
</head>
<body>
  <div id="root"></div>
  <script type="text/babel">
    const { useState, useEffect } = React;

    // ── Open-Meteo helpers ────────────────────────────────────────────────────
    function wmoEmoji(c) {
      if (c === 0)  return "☀";
      if (c <= 2)   return "🌤";
      if (c === 3)  return "☁";
      if (c <= 48)  return "🌫";
      if (c <= 55)  return "🌦";
      if (c <= 65)  return "🌧";
      if (c <= 67)  return "🌨";
      if (c <= 77)  return "❄";
      if (c <= 82)  return "🌦";
      if (c <= 86)  return "🌨";
      return "⛈";
    }
    function wmoCondition(c) {
      if (c === 0)  return "Clear";
      if (c <= 2)   return "Mostly Sunny";
      if (c === 3)  return "Overcast";
      if (c <= 48)  return "Foggy";
      if (c <= 55)  return "Drizzle";
      if (c <= 65)  return "Rain";
      if (c <= 77)  return "Sleet/Snow";
      if (c <= 82)  return "Showers";
      if (c <= 86)  return "Snow Showers";
      return "Thunderstorm";
    }
    function mmToRain(mm) {
      if (mm < 1)  return "Low";
      if (mm < 10) return "Medium";
      return "High";
    }

    const trip = {
      title: "Perth & Margaret River",
      subtitle: "Jun 2 – 11, 2026  ·  Edwin & Family",
      days: [
        {
          date: "Tue, Jun 2", label: "DAY 1",
          location: "Singapore → Perth → Margaret River",
          phase: "margaret", weatherIcon: "🌤", high: 17, low: 11, rain: "Low",
          events: [
            { time: "00:10", icon: "✈", text: "Depart SIN on SQ225 (Boeing 787)", ref: "FA7YQZ" },
            { time: "05:10", icon: "🛬", text: "Land at Perth Intl (Terminal 1)" },
            { time: "07:00", icon: "🚗", text: "Pick up 7-seat SUV at No Birds Kewdale", ref: "9B477M" },
            { time: "09:30", icon: "🥕", text: "Pitstop — The Crooked Carrot, Myalup", cal: true },
            { time: "13:30", icon: "🍷", text: "Lunch – Swings & Roundabouts, Yallingup (9 pax)", ref: "26198277", cal: true },
            { time: "16:30", icon: "🏡", text: "Check in – Margaret River Holiday Cottages", ref: "SWLE4P", cal: true },
            { time: "18:30", icon: "🛒", text: "Coles Margaret River — supermarket run & dinner", cal: true },
          ],
          tip: "Brick + Timber cottages at 185 Boodjidup Rd • 6 adults, 3 children • AUD 4,014 • Note: Swings & Roundabouts lunch (1:30pm) is en route — check-in at cottages 4:30pm",
        },
        {
          date: "Wed, Jun 3", label: "DAY 2", location: "Margaret River",
          phase: "margaret", weatherIcon: "🌤", high: 17, low: 11, rain: "Low",
          events: [
            { time: "08:00", icon: "🐾", text: "Animal feeding at cottages", cal: true },
            { time: "09:30", icon: "🍳", text: "Breakfast at Brick 2 (maybe)", cal: true },
            { time: "All day", icon: "🍷", text: "Wine trail – Vasse Felix, Cullen Wines, Cape Mentelle", sug: true },
            { time: "12:00", icon: "🍽", text: "Lunch and Playgrounds at Busselton", cal: true },
            { time: "15:30", icon: "🛒", text: "Kmart Busselton — buy dinner supplies", cal: true },
            { time: "Sunset", icon: "🌊", text: "Surfers Point lookout & Prevelly Beach", sug: true },
            { time: "19:00", icon: "🔥", text: "Hosted firepit evening — marshmallows provided!" },
          ],
          tip: "Cool 17°C days — layer up for evenings by the firepit!",
        },
        {
          date: "Thu, Jun 4", label: "DAY 3", location: "Margaret River",
          phase: "margaret", weatherIcon: "☁", high: 18, low: 11, rain: "Medium",
          events: [
            { time: "08:00", icon: "🐾", text: "Animal feeding at cottages", cal: true },
            { time: "09:30", icon: "🍳", text: "Breakfast at Brick 2 (maybe)", cal: true },
            { time: "11:00", icon: "🎯", text: "A Maze'n Margaret River", cal: true },
            { time: "Morning", icon: "🌲", text: "Boranup Forest & Hamelin Bay drive", sug: true },
            { time: "Afternoon", icon: "🦅", text: "Cape Leeuwin Lighthouse (two-ocean meeting point)", sug: true },
            { time: "Evening", icon: "🔥", text: "BBQ at cottage & stargazing", sug: true },
          ],
          tip: "Highest chance of rain this stretch — pack ponchos",

        {

            { time: "09:30", icon: "🍳", text: "Breakfast at Brick 2 (maybe)", cal: true },
            { time: "Morning", icon: "🧀", text: "Farmhouse & artisan produce market", sug: true },
            { time: "Afternoon", icon: "🍫", text: "Chocolate factory & craft beer trail", sug: true },
            { time: "19:00", icon: "🔥", text: "Hosted firepit evening — last night, marshmallows & stargazing!" },
          ],
          tip: "Reception open 09:00–17:00  ·  📞 +61 8 9757 2185",
        },
        {

            { time: "10:00", icon: "🏡", text: "Check out Margaret River Cottages (by 10am)" },
            { time: "~13:00", icon: "🚗", text: "3-hr drive north to Perth" },
            { time: "14:00", icon: "🏠", text: "Check in – Private Green Oasis, Willetton", ref: "HMK9A5JFFD", cal: true },
            { time: "15:00", icon: "🛬", text: "Pick up Elaine from Perth Airport (T1)", cal: true },
          ],
          tip: "8 The Taffrail, Willetton WA 6155 • Host: Raj & Rav • +61 488 111 762 • SGD 1,641",
        },
        {

          phase: "perth", weatherIcon: "⛅", high: 17, low: 14, rain: "Low",

        {
          date: "Tue, Jun 9", label: "DAY 8", location: "Perth",
          phase: "perth", weatherIcon: "☀", high: 20, low: 19, rain: "Low",

            { time: "Morning", icon: "🐧", text: "Penguin Island Ferry & sea life tour", sug: true },
            { time: "Afternoon", icon: "🏖", text: "Rockingham beach or Shoalwater Bay", sug: true },
            { time: "Evening", icon: "🥂", text: "Rooftop dinner in the CBD", sug: true },

        {

          events: [
            { time: "Morning", icon: "🏛", text: "Perth Cultural Centre & WA Museum", sug: true },
            { time: "Afternoon", icon: "☕", text: "Northbridge laneways & specialty coffee", sug: true },
            { time: "Evening", icon: "🛄", text: "Pack up & farewell dinner", sug: true },
          ],
          tip: "Last full day — savour it!",
        },
        {
          date: "Thu, Jun 11", label: "DAY 10", location: "Perth → Singapore",
          phase: "homebound", weatherIcon: "🌤", high: 17, low: 11, rain: "Low",
          events: [
            { time: "11:00", icon: "🏠", text: "Check out Willetton Airbnb (by 11am)", cal: true },
            { time: "13:00", icon: "🚗", text: "Return 7-seat SUV at No Birds Kewdale", cal: true },
            { time: "14:00", icon: "🚌", text: "Arrive Perth Airport T1 (2 hrs before flight)", cal: true },
            { time: "16:55", icon: "✈", text: "Depart PER on SQ214 (A350-900)", ref: "FA7YQZ" },
            { time: "22:10", icon: "🏠", text: "Arrive Singapore Changi" },
          ],
          tip: "Return SQ214 • Economy • Terminal 1 → Singapore T3",
        },
      ],
    };

    const phaseColors = {
      margaret: { bg: "#edf7e8", accent: "#2e7d32", badge: "#c8e6c9", text: "#1b5e20" },
      transit:  { bg: "#fef8e7", accent: "#b45309", badge: "#fde68a", text: "#7c2d12" },
      perth:    { bg: "#e8f2fc", accent: "#1d4ed8", badge: "#bfdbfe", text: "#1e3a8a" },
      homebound:{ bg: "#f3eeff", accent: "#7c3aed", badge: "#ddd6fe", text: "#4c1d95" },
    };

    const phaseLabel = {
      margaret: "🌿 Margaret River",
      transit: "🚗 Transit Day",
      perth: "🌆 Perth City",
      homebound: "✈ Homebound",
    };

    function App() {
      const [selected, setSelected] = useState(null);
      const [wx, setWx] = useState(null);

      useEffect(() => {
        const BASE = 'https://api.open-meteo.com/v1/forecast?daily=weathercode,temperature_2m_max,temperature_2m_min,precipitation_sum&timezone=Australia%2FPerth&start_date=2026-06-02&end_date=2026-06-11';
        Promise.all([
          fetch(BASE + '&latitude=-33.9536&longitude=115.0752').then(r => r.json()),
          fetch(BASE + '&latitude=-31.9505&longitude=115.8605').then(r => r.json()),
        ]).then(([mr, pt]) => {
          const map = {};
          trip.days.forEach((day, i) => {
            const data = (day.phase === 'perth' || day.phase === 'homebound') ? pt : mr;
            const code = data.daily.weathercode[i];
            map[i] = {
              weatherIcon: wmoEmoji(code),
              wmoCode:     code,
              high:        Math.round(data.daily.temperature_2m_max[i]),
              low:         Math.round(data.daily.temperature_2m_min[i]),
              rain:        mmToRain(data.daily.precipitation_sum[i]),
            };
          });
          setWx(map);
        }).catch(e => console.warn('Weather fetch failed, using static data', e));
      }, []);

      return (
        <div style={{
          fontFamily: "'Georgia', 'Times New Roman', serif",
          background: "linear-gradient(135deg, #f4f0e8 0%, #eef2f8 50%, #f2eef8 100%)",
          minHeight: "100vh",
          padding: "32px 16px",
          color: "#1e2a3a",
        }}>
          {/* Header */}
          <div style={{ textAlign: "center", marginBottom: 40 }}>
            <div style={{
              display: "inline-block",
              background: "linear-gradient(90deg, #2e7d32, #1d4ed8, #7c3aed)",
              WebkitBackgroundClip: "text",
              WebkitTextFillColor: "transparent",
              fontSize: 13,
              letterSpacing: 6,
              fontFamily: "sans-serif",
              fontWeight: 700,
              textTransform: "uppercase",
              marginBottom: 8,
            }}>✦ Western Australia ✦</div>
            <h1 style={{
              fontSize: "clamp(28px, 5vw, 52px)",
              fontWeight: 900,
              margin: "0 0 6px",
              color: "#1a1810",
              letterSpacing: -1,
              lineHeight: 1.1,
            }}>{trip.title}</h1>
            <div style={{ fontSize: 15, color: "#6a7a8a", letterSpacing: 2, fontFamily: "sans-serif" }}>
              {trip.subtitle}
            </div>
            {/* Legend */}
            <div style={{ display: "flex", gap: 12, justifyContent: "center", marginTop: 20, flexWrap: "wrap" }}>
              {Object.entries(phaseColors).map(([key, c]) => (
                <span key={key} style={{
                  background: c.badge, color: c.text, fontSize: 11,
                  padding: "4px 10px", borderRadius: 20, letterSpacing: 1,
                  fontFamily: "sans-serif", border: `1px solid ${c.accent}44`,
                  fontWeight: 600,
                }}>{phaseLabel[key]}</span>
              ))}
            </div>
            {/* Booking refs */}
            <div style={{ marginTop: 16, display: "flex", gap: 8, justifyContent: "center", flexWrap: "wrap" }}>
              {[
                { label: "SQ Flight", ref: "FA7YQZ", icon: "✈" },
                { label: "Car Rental", ref: "9B477M", icon: "🚗" },
                { label: "Cottages", ref: "SWLE4P", icon: "🏡" },
                { label: "Airbnb Perth", ref: "HMK9A5JFFD", icon: "🏠" },
              ].map(b => (
                <div key={b.ref} style={{
                  background: "#ffffff", border: "1px solid #d0d8e4", borderRadius: 8,
                  padding: "5px 12px", fontSize: 11, fontFamily: "monospace",
                  color: "#2a5080", display: "flex", gap: 6, alignItems: "center",
                  boxShadow: "0 1px 3px rgba(0,0,0,0.06)",
                }}>
                  <span>{b.icon}</span>
                  <span style={{ color: "#6a7a8a" }}>{b.label}:</span>
                  <strong>{b.ref}</strong>
                </div>
              ))}
            </div>
          </div>

          {/* Days Grid */}
          <div style={{
            maxWidth: 960, margin: "0 auto",
            display: "grid",
            gridTemplateColumns: "repeat(auto-fill, minmax(280px, 1fr))",
            gap: 16,
          }}>
            {trip.days.map((day, i) => {
              const c = phaseColors[day.phase];
              const isOpen = selected === i;
              const wxDay      = wx?.[i];
              const wIcon      = wxDay?.weatherIcon ?? day.weatherIcon;
              const wHigh      = wxDay?.high        ?? day.high;
              const wLow       = wxDay?.low         ?? day.low;
              const wRain      = wxDay?.rain        ?? day.rain;
              const wCondition = wxDay ? wmoCondition(wxDay.wmoCode) : "—";
              return (
                <div key={i} onClick={() => setSelected(isOpen ? null : i)} style={{
                  background: `linear-gradient(145deg, ${c.bg} 0%, #ffffff 100%)`,
                  border: `1px solid ${isOpen ? c.accent : c.badge}`,
                  borderRadius: 16, padding: "18px 20px", cursor: "pointer",
                  transition: "all 0.25s ease",
                  boxShadow: isOpen
                    ? `0 0 0 3px ${c.accent}22, 0 4px 20px rgba(0,0,0,0.12)`
                    : "0 2px 8px rgba(0,0,0,0.07)",
                  transform: isOpen ? "scale(1.02)" : "scale(1)",
                  position: "relative", overflow: "hidden",
                }}>
                  {/* Glow bar */}
                  <div style={{
                    position: "absolute", top: 0, left: 0, right: 0, height: 3,
                    background: `linear-gradient(90deg, transparent, ${c.accent}, transparent)`,
                    opacity: isOpen ? 0.9 : 0.35,
                  }} />

                  {/* Day header */}
                  <div style={{ display: "flex", justifyContent: "space-between", alignItems: "flex-start", marginBottom: 12 }}>
                    <div>
                      <div style={{ fontSize: 11, fontFamily: "sans-serif", letterSpacing: 3, color: c.accent, fontWeight: 700, textTransform: "uppercase", marginBottom: 2 }}>
                        {day.label}
                      </div>
                      <div style={{ fontSize: 15, fontWeight: 700, color: "#1a2030", lineHeight: 1.2 }}>{day.date}</div>
                      <div style={{ fontSize: 11, color: "#7a8898", fontFamily: "sans-serif", marginTop: 3 }}>{day.location}</div>
                    </div>
                    {/* Weather badge */}
                    <div style={{ background: "#ffffff", border: `1px solid ${c.badge}`, borderRadius: 12, padding: "6px 10px", textAlign: "center", minWidth: 72, boxShadow: "0 1px 4px rgba(0,0,0,0.07)" }}>
                      <div style={{ fontSize: 20, lineHeight: 1 }}>{wIcon}</div>
                      <div style={{ fontSize: 11, color: c.accent, fontFamily: "sans-serif", marginTop: 3, fontWeight: 700 }}>{wHigh}° / {wLow}°</div>

                  </div>

                  {/* Events */}
                  <div style={{ marginBottom: 10 }}>
                    {(isOpen ? day.events : day.events.slice(0, 2)).map((ev, j) => (
                      <div key={j} style={{
                        display: "flex", gap: 8, alignItems: "flex-start", marginBottom: 7,
                        opacity: j === 1 && !isOpen && day.events.length > 2 ? 0.5 : 1,
                      }}>
                        <span style={{ fontSize: 15, flexShrink: 0, lineHeight: 1.4 }}>{ev.icon}</span>
                        <div>
                          <span style={{ fontSize: 10, color: c.accent, fontFamily: "monospace", marginRight: 4, fontWeight: 600 }}>{ev.time}</span>
                          <span style={{ fontSize: 12, color: ev.sug ? "#9a9488" : "#2a3040", fontFamily: "sans-serif", lineHeight: 1.4 }}>{ev.text}</span>
                          {ev.ref && <span style={{ fontSize: 10, color: "#7a90a8", fontFamily: "monospace", marginLeft: 4 }}>[{ev.ref}]</span>}
                          {ev.cal && <span style={{ fontSize: 9, background: "#dbeafe", color: "#1e40af", border: "1px solid #93c5fd", borderRadius: 4, padding: "1px 5px", marginLeft: 5, fontFamily: "sans-serif", letterSpacing: 0.5, verticalAlign: "middle" }}>📅 cal</span>}
                          {ev.sug && <span style={{ fontSize: 9, background: "#fef9c3", color: "#92400e", border: "1px solid #fde68a", borderRadius: 4, padding: "1px 5px", marginLeft: 5, fontFamily: "sans-serif", letterSpacing: 0.5, verticalAlign: "middle" }}>💡 idea</span>}
                        </div>
                      </div>
                    ))}
                    {!isOpen && day.events.length > 2 && (
                      <div style={{ fontSize: 11, color: c.accent, fontFamily: "sans-serif", marginTop: 4, letterSpacing: 1, fontWeight: 600 }}>
                        +{day.events.length - 2} more ›
                      </div>
                    )}
                  </div>

                  {/* Tip */}
                  {isOpen && (
                    <div style={{ marginTop: 12, padding: "8px 12px", background: c.badge + "88", borderLeft: `3px solid ${c.accent}`, borderRadius: "0 8px 8px 0", fontSize: 11, color: c.text, fontFamily: "sans-serif", lineHeight: 1.5 }}>
                      {day.tip}
                    </div>
                  )}

                  {/* Rain indicator */}
                  <div style={{ display: "flex", gap: 4, alignItems: "center", marginTop: 10 }}>
                    <span style={{ fontSize: 10, color: "#9aaabb", fontFamily: "sans-serif" }}>Rain:</span>
                    {["Low", "Medium", "High"].map(r => (
                      <div key={r} style={{ width: 18, height: 4, borderRadius: 2, background: wRain === r ? (r === "Low" ? "#16a34a" : r === "Medium" ? "#d97706" : "#dc2626") : "#dde4ec" }} />
                    ))}
                    <span style={{ fontSize: 10, color: "#6a7a8a", fontFamily: "sans-serif" }}>{wRain}</span>
                  </div>
                </div>
              );
            })}
          </div>

          {/* Weather strip */}
          <div style={{ maxWidth: 960, margin: "32px auto 0" }}>
            <div style={{ background: "#ffffff", border: "1px solid #dde4ec", borderRadius: 16, padding: "20px 24px", overflow: "hidden", boxShadow: "0 2px 8px rgba(0,0,0,0.06)" }}>
              <div style={{ fontSize: 11, letterSpacing: 4, color: "#8a9ab0", fontFamily: "sans-serif", textTransform: "uppercase", marginBottom: 16 }}>
                ☁ 10-Day Weather Overview — Perth & Margaret River
              </div>
              <div style={{ display: "flex", gap: 0, overflowX: "auto" }}>
                {trip.days.map((d, i) => {
                  const c    = phaseColors[d.phase];
                  const wxD  = wx?.[i];
                  const icon = wxD?.weatherIcon ?? d.weatherIcon;
                  const hi   = wxD?.high        ?? d.high;
                  const lo   = wxD?.low         ?? d.low;
                  const rain = wxD?.rain        ?? d.rain;
                  return (
                    <div key={i} style={{ flex: "1 0 80px", textAlign: "center", padding: "12px 6px", borderRight: i < trip.days.length - 1 ? "1px solid #e8ecf2" : "none", background: i % 2 === 0 ? "transparent" : "#f8fafc" }}>
                      <div style={{ fontSize: 10, color: "#8a9aaa", fontFamily: "sans-serif", marginBottom: 4 }}>{d.date.split(",")[0]}</div>
                      <div style={{ fontSize: 22, marginBottom: 4 }}>{icon}</div>
                      <div style={{ fontSize: 13, fontWeight: 700, color: c.accent, fontFamily: "sans-serif" }}>{hi}°</div>
                      <div style={{ fontSize: 11, color: "#8a9aaa", fontFamily: "sans-serif" }}>{lo}°</div>
                      <div style={{ width: 6, height: 6, borderRadius: "50%", margin: "6px auto 0", background: rain === "Low" ? "#16a34a" : rain === "Medium" ? "#d97706" : "#dc2626" }} />
                    </div>
                  );
                })}
              </div>
              <div style={{ display: "flex", gap: 16, marginTop: 12, justifyContent: "flex-end" }}>
                {[["#16a34a", "Low rain"], ["#d97706", "Med rain"], ["#dc2626", "High rain"]].map(([col, label]) => (
                  <div key={label} style={{ display: "flex", gap: 5, alignItems: "center" }}>
                    <div style={{ width: 8, height: 8, borderRadius: "50%", background: col }} />
                    <span style={{ fontSize: 10, color: "#8a9aaa", fontFamily: "sans-serif" }}>{label}</span>
                  </div>
                ))}
              </div>
            </div>
          </div>

          {/* Badge legend */}
          <div style={{ display: "flex", gap: 16, justifyContent: "center", marginTop: 24, flexWrap: "wrap" }}>
            <div style={{ display: "flex", gap: 6, alignItems: "center" }}>
              <span style={{ fontSize: 9, background: "#dbeafe", color: "#1e40af", border: "1px solid #93c5fd", borderRadius: 4, padding: "2px 7px", fontFamily: "sans-serif", letterSpacing: 0.5 }}>📅 cal</span>
              <span style={{ fontSize: 11, color: "#6a7a8a", fontFamily: "sans-serif" }}>Confirmed calendar event</span>
            </div>
            <div style={{ display: "flex", gap: 6, alignItems: "center" }}>
              <span style={{ fontSize: 9, background: "#fef9c3", color: "#92400e", border: "1px solid #fde68a", borderRadius: 4, padding: "2px 7px", fontFamily: "sans-serif", letterSpacing: 0.5 }}>💡 idea</span>
              <span style={{ fontSize: 11, color: "#6a7a8a", fontFamily: "sans-serif" }}>Generic suggestion — not yet booked</span>
            </div>
          </div>

          {/* Footer */}
          <div style={{ textAlign: "center", marginTop: 20, fontSize: 11, color: "#9aaabb", fontFamily: "sans-serif", letterSpacing: 1 }}>
            {wx ? "🌐 Live forecast via Open-Meteo" : "⏳ Loading live weather…"} · Click any day card to expand · Have an amazing trip! 🌿
          </div>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById("root"));
    root.render(<App />);
  </script>
</body>
</html>
