    function wmoEmoji(c) {
      if (c === 0)  return "☀";
      if (c <= 2)   return "🌤";
      if (c === 3)  return "☁";
      if (c <= 48)  return "🌫";
      if (c <= 55)  return "🌦";
      if (c <= 65)  return "🌧";
      if (c <= 67)  return "🌨";
      if (c <= 77)  return "❄";
      if (c <= 82)  return "🌦";
      if (c <= 86)  return "🌨";
      return "⛈";
    }
    function wmoCondition(c) {
      if (c === 0)  return "Clear";
      if (c <= 2)   return "Mostly Sunny";
      if (c === 3)  return "Overcast";
      if (c <= 48)  return "Foggy";
      if (c <= 55)  return "Drizzle";
      if (c <= 65)  return "Rain";
      if (c <= 77)  return "Sleet/Snow";
      if (c <= 82)  return "Showers";
      if (c <= 86)  return "Snow Showers";
      return "Thunderstorm";
    }
    function mmToRain(mm) {
      if (mm < 1)  return "Low";
      if (mm < 10) return "Medium";
      return "High";
    }
    // Returns badge gradient + text colours keyed to WMO weather code
    function weatherColors(code) {
      if (code === 0)  return { bg: "linear-gradient(145deg,#fef9c3,#fde68a)", hi: "#92400e", lo: "#b45309", border: "#fcd34d" }; // Clear
      if (code <= 2)   return { bg: "linear-gradient(145deg,#e0f2fe,#fef9c3)", hi: "#0369a1", lo: "#0284c7", border: "#7dd3fc" }; // Mostly sunny
      if (code === 3)  return { bg: "linear-gradient(145deg,#f1f5f9,#dde3ea)", hi: "#374151", lo: "#6b7280", border: "#cbd5e1" }; // Overcast
      if (code <= 48)  return { bg: "linear-gradient(145deg,#f8fafc,#e8ecf2)", hi: "#475569", lo: "#6b7280", border: "#dde4ec" }; // Fog
      if (code <= 55)  return { bg: "linear-gradient(145deg,#dbeafe,#ede9fe)", hi: "#1d4ed8", lo: "#4338ca", border: "#93c5fd" }; // Drizzle
      if (code <= 65)  return { bg: "linear-gradient(145deg,#bfdbfe,#93c5fd)", hi: "#1e3a8a", lo: "#1d4ed8", border: "#60a5fa" }; // Rain
      if (code <= 77)  return { bg: "linear-gradient(145deg,#e0f2fe,#f0f9ff)", hi: "#0369a1", lo: "#38bdf8", border: "#bae6fd" }; // Snow/sleet
      if (code <= 82)  return { bg: "linear-gradient(145deg,#bfdbfe,#dbeafe)", hi: "#1e3a8a", lo: "#1d4ed8", border: "#60a5fa" }; // Showers
      return          { bg: "linear-gradient(145deg,#ddd6fe,#fce7f3)",         hi: "#4c1d95", lo: "#6d28d9", border: "#c4b5fd" }; // Thunderstorm
    }

    function FlightStatusPanel() {
      const [liveFlights, setLiveFlights] = useState({});
      const [checkedAt, setCheckedAt]     = useState(null);

      useEffect(() => {
        const today = new Date().toISOString().slice(0,10);
        const toCheck = FLIGHTS_META.filter(f =>
          f.depDate === today || new Date(f.depUTC).toISOString().slice(0,10) === today
        );
        if (!toCheck.length) return;

        Promise.all(toCheck.map(async f => {
          const begin = Math.floor((f.depUTC - 3 * 3600000) / 1000);
          const end   = Math.floor((f.depUTC + 9 * 3600000) / 1000);
          try {
            const r = await fetch(`https://opensky-network.org/api/flights/departure?airport=${f.icao}&begin=${begin}&end=${end}`);
            if (!r.ok) return null;
            const list = await r.json();
            const num = f.iata.replace('SQ','');
            const hit = list.find(d => {
              const cs = (d.callsign || '').trim().toUpperCase();
              return cs === `SIA${num}` || cs === `SIA0${num}`;
            });
            return hit ? { iata: f.iata, ...hit } : null;
          } catch { return null; }
        })).then(results => {
          const map = {};
          results.filter(Boolean).forEach(r => { map[r.iata] = r; });
          setLiveFlights(map);
          setCheckedAt(new Date().toLocaleTimeString('en-SG',{ hour:'2-digit', minute:'2-digit' }));
        });
      }, []);

      const today = new Date().toISOString().slice(0,10);

      return (
        <div style={{ maxWidth:960, margin:"0 auto 16px", display:"flex", gap:14, flexWrap:"wrap" }}>
          {FLIGHTS_META.map(f => {
            const live    = liveFlights[f.iata];
            const isToday = f.depDate === today;
            const isPast  = f.depDate < today;
            let badge;
            if      (isPast)              badge = { label:"Completed", bg:"#e2e8f0", text:"#475569", dot:"#94a3b8" };
            else if (isToday && live)     badge = { label:"● In air",  bg:"#bbf7d0", text:"#166534", dot:"#22c55e" };

                  { hour:'2-digit', minute:'2-digit',

    // Try each proxy in order, return first successful HTML string
    async function fetchViaProxy(url) {
      const proxies = [
        u => `https://corsproxy.io/?${encodeURIComponent(u)}`,
        u => `https://api.allorigins.win/raw?url=${encodeURIComponent(u)}`,
        u => `https://api.codetabs.com/v1/proxy?quest=${encodeURIComponent(u)}`,
      ];
      for (const make of proxies) {
        try {
          const r = await fetch(make(url), { signal: AbortSignal.timeout(6000) });
          if (r.ok) { const t = await r.text(); if (t.length > 200) return t; }
        } catch {}
      }
      return null;
    }

    function TravelAdvisory() {
      const [advisory, setAdvisory]   = useState(null);
      const [loading, setLoading]     = useState(true);
      const [checkedAt, setCheckedAt] = useState(null);

      const fetchAdvisory = async (force = false) => {
        setLoading(true);
        if (!force) {
          try {
            const cached = JSON.parse(sessionStorage.getItem('mfa_adv') || 'null');
            if (cached && Date.now() - cached.ts < 30 * 60000) {
              setAdvisory(cached); setCheckedAt(cached.checkedAt); setLoading(false); return;
            }
          } catch {}
        }
        const html = await fetchViaProxy(MFA_URL);
        const now  = new Date().toLocaleString('en-SG',{ hour:'2-digit', minute:'2-digit', day:'numeric', month:'short' });
        let found  = null;
        let snippet = null;
        if (html) {
          // Normalise HTML: strip scripts/styles, remove tags, decode entities, collapse whitespace
          const text = html
            .replace(/<script[\s\S]*?<\/script>/gi, ' ')
            .replace(/<style[\s\S]*?<\/style>/gi, ' ')
            .replace(/<[^>]+>/g, ' ')
            .replace(/&nbsp;/gi, ' ').replace(/&amp;/gi, '&')
            .replace(/&lt;/gi, '<').replace(/&gt;/gi, '>')
            .replace(/&quot;/gi, '"').replace(/&#\d+;/g, ' ')
            .replace(/\s+/g, ' ').trim();
          for (const p of ADV_LEVELS) { if (p.re.test(text)) { found = p; break; } }
          if (!found) found = { label:"See MFA website", bg:"#f0f4f8", text:"#334155", border:"#cbd5e1", dot:"#94a3b8" };
          // Extract first meaningful advisory sentence from plain text
          const m = text.match(/While Australia[^.]{10,220}\./i)
                 || text.match(/Australia is generally[^.]{10,220}\./i)
                 || text.match(/exercise (?:precautions|caution)[^.]{10,200}\./i)
                 || text.match(/remain vigilant[^.]{5,200}\./i);
          if (m) snippet = m[0].replace(/\s+/g,' ').trim().slice(0, 220);
        } else {
          found = ADV_DEFAULT;
        }
        const data = { ...found, snippet, checkedAt: now, ts: Date.now() };
        sessionStorage.setItem('mfa_adv', JSON.stringify(data));
        setAdvisory(data); setCheckedAt(now);
        setLoading(false);
      };

      useEffect(() => { fetchAdvisory(); }, []);

      const adv = advisory || { bg:"#f4f6fa", text:"#334155", border:"#dde4ec", dot:"#94a3b8" };
      return (
        <div style={{ maxWidth:960, margin:"0 auto 28px", background:adv.bg, border:`1px solid ${adv.border}`, borderRadius:14, padding:"14px 20px", boxShadow:"0 2px 8px rgba(0,0,0,0.06)" }}>
          <div style={{ display:"flex", justifyContent:"space-between", alignItems:"center", flexWrap:"wrap", gap:10 }}>
            <div style={{ display:"flex", gap:12, alignItems:"center" }}>
              <span style={{ fontSize:28 }}>🇦🇺</span>
              <div>
                <div style={{ fontSize:10, color:"#7a8898", fontFamily:"sans-serif", letterSpacing:2, textTransform:"uppercase", marginBottom:3 }}>
                  Singapore MFA · Australia Travel Advisory
                </div>
                {loading && <div style={{ fontSize:13, color:"#7a8898", fontFamily:"sans-serif" }}>Fetching advisory…</div>}
                {advisory && !loading && (
                  <div>
                    <div style={{ display:"flex", alignItems:"center", gap:8 }}>
                      <div style={{ width:9, height:9, borderRadius:"50%", background:adv.dot, flexShrink:0 }} />
                      <span style={{ fontSize:15, fontWeight:700, color:adv.text, fontFamily:"sans-serif" }}>{advisory.label}</span>
                    </div>
                    {advisory.snippet && (
                      <div style={{ fontSize:11, color:adv.text, fontFamily:"sans-serif", marginTop:5, opacity:0.8, maxWidth:520, lineHeight:1.5 }}>
                        "{advisory.snippet}"
                      </div>
                    )}
                    {advisory.stale && <div style={{ fontSize:10, color:"#b45309", fontFamily:"sans-serif", marginTop:3 }}>* Could not reach MFA — last known level shown. Verify on MFA site.</div>}
                  </div>
                )}
              </div>
            </div>
            <div style={{ display:"flex", gap:8, alignItems:"center", flexShrink:0 }}>
              {checkedAt && <span style={{ fontSize:10, color:"#9aaabb", fontFamily:"sans-serif" }}>Checked {checkedAt}</span>}
              <button onClick={() => fetchAdvisory(true)} disabled={loading} style={{
                fontSize:10, background:"#ffffff", border:"1px solid #d0d8e4", borderRadius:6,
                padding:"4px 10px", cursor:"pointer", color:"#475569", fontFamily:"sans-serif",
                fontWeight:600, opacity: loading ? 0.5 : 1,
              }}>↻ Refresh</button>
              <a href={MFA_LINK} target="_blank" rel="noopener" style={{
                fontSize:10, color:"#1d4ed8", background:"#dbeafe", border:"1px solid #93c5fd",
                borderRadius:6, padding:"4px 10px", textDecoration:"none", fontFamily:"sans-serif", fontWeight:600,
              }}>MFA site ↗</a>
            </div>
          </div>
        </div>
      );
    }

    function App() {
      const [selected, setSelected] = useState(null);
      const [wx, setWx] = useState(null);

      useEffect(() => {
        const BASE = 'https://api.open-meteo.com/v1/forecast?daily=weathercode,temperature_2m_max,temperature_2m_min,precipitation_sum&timezone=Australia%2FPerth&start_date=2026-06-02&end_date=2026-06-11';
        Promise.all([
          fetch(BASE + '&latitude=-33.9536&longitude=115.0752').then(r => r.json()),
          fetch(BASE + '&latitude=-31.9505&longitude=115.8605').then(r => r.json()),
        ]).then(([mr, pt]) => {
          const map = {};
          trip.days.forEach((day, i) => {
            const data = (day.phase === 'perth' || day.phase === 'homebound') ? pt : mr;
            const code = data.daily.weathercode[i];
            map[i] = {
              weatherIcon: wmoEmoji(code),
              wmoCode:     code,
              high:        Math.round(data.daily.temperature_2m_max[i]),
              low:         Math.round(data.daily.temperature_2m_min[i]),
              rain:        mmToRain(data.daily.precipitation_sum[i]),
            };
          });
          setWx(map);
        }).catch(e => console.warn('Weather fetch failed, using static data', e));
      }, []);

      return (
        <div style={{
          fontFamily: "'Georgia', 'Times New Roman', serif",
          background: "linear-gradient(135deg, #f4f0e8 0%, #eef2f8 50%, #f2eef8 100%)",
          minHeight: "100vh",
          padding: "32px 16px",
          color: "#1e2a3a",
        }}>
          {/* Header */}
          <div style={{ textAlign: "center", marginBottom: 40 }}>
            <div style={{
              display: "inline-block",
              background: "linear-gradient(90deg, #2e7d32, #1d4ed8, #7c3aed)",
              WebkitBackgroundClip: "text",
              WebkitTextFillColor: "transparent",
              fontSize: 13,
              letterSpacing: 6,
              fontFamily: "sans-serif",
              fontWeight: 700,
              textTransform: "uppercase",
              marginBottom: 8,
            }}>✦ Western Australia ✦</div>
            <h1 style={{
              fontSize: "clamp(28px, 5vw, 52px)",
              fontWeight: 900,
              margin: "0 0 6px",
              color: "#1a1810",
              letterSpacing: -1,
              lineHeight: 1.1,
            }}>{trip.title}</h1>
            <div style={{ fontSize: 15, color: "#6a7a8a", letterSpacing: 2, fontFamily: "sans-serif" }}>
              {trip.subtitle}
            </div>
            {/* Legend */}
            <div style={{ display: "flex", gap: 12, justifyContent: "center", marginTop: 20, flexWrap: "wrap" }}>
              {Object.entries(phaseColors).map(([key, c]) => (
                <span key={key} style={{
                  background: c.badge, color: c.text, fontSize: 11,
                  padding: "4px 10px", borderRadius: 20, letterSpacing: 1,
                  fontFamily: "sans-serif", border: `1px solid ${c.accent}44`,
                  fontWeight: 600,
                }}>{phaseLabel[key]}</span>
              ))}
            </div>
            {/* Booking refs */}
            <div style={{ marginTop: 16, display: "flex", gap: 8, justifyContent: "center", flexWrap: "wrap" }}>
              {[
                { label: "SQ Flight", ref: "FA7YQZ", icon: "✈" },
                { label: "Car Rental", ref: "9B477M", icon: "🚗" },
                { label: "Cottages", ref: "SWLE4P", icon: "🏡" },
                { label: "Airbnb Perth", ref: "HMK9A5JFFD", icon: "🏠" },
              ].map(b => (
                <div key={b.ref} style={{
                  background: "#ffffff", border: "1px solid #d0d8e4", borderRadius: 8,
                  padding: "5px 12px", fontSize: 11, fontFamily: "monospace",
                  color: "#2a5080", display: "flex", gap: 6, alignItems: "center",
                  boxShadow: "0 1px 3px rgba(0,0,0,0.06)",
                }}>
                  <span>{b.icon}</span>
                  <span style={{ color: "#6a7a8a" }}>{b.label}:</span>
                  <strong>{b.ref}</strong>
                </div>
              ))}
            </div>
          </div>

          {/* Live Updates */}
          <div style={{ maxWidth:960, margin:"0 auto 6px", textAlign:"center" }}>
            <div style={{ fontSize:10, letterSpacing:4, color:"#8a9ab0", fontFamily:"sans-serif", textTransform:"uppercase", marginBottom:14 }}>
              🔴 Live Updates
            </div>
          </div>
          <FlightStatusPanel />
          <TravelAdvisory />

          {/* Days Grid */}
          <div style={{
            maxWidth: 960, margin: "0 auto",
            display: "grid",
            gridTemplateColumns: "repeat(auto-fill, minmax(280px, 1fr))",
            gap: 16,
          }}>
            {trip.days.map((day, i) => {
              const c = phaseColors[day.phase];
              const isOpen = selected === i;
              const wxDay      = wx?.[i];
              const wIcon      = wxDay?.weatherIcon ?? day.weatherIcon;
              const wHigh      = wxDay?.high        ?? day.high;
              const wLow       = wxDay?.low         ?? day.low;
              const wRain      = wxDay?.rain        ?? day.rain;
              const wCondition = wxDay ? wmoCondition(wxDay.wmoCode) : "—";
              const wCol       = weatherColors(wxDay?.wmoCode ?? emojiCode(day.weatherIcon));
              return (
                <div key={i} onClick={() => setSelected(isOpen ? null : i)} style={{
                  background: `linear-gradient(145deg, ${c.bg} 0%, #ffffff 100%)`,
                  border: `1px solid ${isOpen ? c.accent : c.badge}`,
                  borderRadius: 16, padding: "18px 20px", cursor: "pointer",
                  transition: "all 0.25s ease",
                  boxShadow: isOpen
                    ? `0 0 0 3px ${c.accent}22, 0 4px 20px rgba(0,0,0,0.12)`
                    : "0 2px 8px rgba(0,0,0,0.07)",
                  transform: isOpen ? "scale(1.02)" : "scale(1)",
                  position: "relative", overflow: "hidden",
                }}>
                  {/* Glow bar */}
                  <div style={{
                    position: "absolute", top: 0, left: 0, right: 0, height: 3,
                    background: `linear-gradient(90deg, transparent, ${c.accent}, transparent)`,
                    opacity: isOpen ? 0.9 : 0.35,
                  }} />

                  {/* Day header */}
                  <div style={{ display: "flex", justifyContent: "space-between", alignItems: "flex-start", marginBottom: 12 }}>
                    <div>
                      <div style={{ fontSize: 11, fontFamily: "sans-serif", letterSpacing: 3, color: c.accent, fontWeight: 700, textTransform: "uppercase", marginBottom: 2 }}>
                        {day.label}
                      </div>
                      <div style={{ fontSize: 15, fontWeight: 700, color: "#1a2030", lineHeight: 1.2 }}>{day.date}</div>
                      <div style={{ fontSize: 11, color: "#7a8898", fontFamily: "sans-serif", marginTop: 3 }}>{day.location}</div>
                    </div>
                    {/* Weather badge */}
                    <div style={{ background: wCol.bg, border: `1px solid ${wCol.border}`, borderRadius: 12, padding: "6px 10px", textAlign: "center", minWidth: 72, boxShadow: "0 1px 4px rgba(0,0,0,0.1)" }}>
                      <div style={{ fontSize: 20, lineHeight: 1 }}>{wIcon}</div>
                      <div style={{ fontSize: 11, fontFamily: "sans-serif", marginTop: 3, fontWeight: 700 }}>
                        <span style={{ color: wCol.hi }}>{wHigh}°</span>
                        <span style={{ color: wCol.lo, fontWeight: 400 }}> / {wLow}°</span>
                      </div>
                      <div style={{ fontSize: 9, color: wCol.lo, fontFamily: "sans-serif" }}>{wCondition}</div>
                      {wx && <div style={{ fontSize: 8, color: "#16a34a", fontFamily: "sans-serif", marginTop: 1, letterSpacing: 0.3 }}>● live</div>}
                    </div>
                  </div>

                  {/* Events */}
                  <div style={{ marginBottom: 10 }}>
                    {(isOpen ? day.events : day.events.slice(0, 2)).map((ev, j) => (
                      <div key={j} style={{
                        display: "flex", gap: 8, alignItems: "flex-start", marginBottom: 7,
                        opacity: j === 1 && !isOpen && day.events.length > 2 ? 0.5 : 1,
                      }}>
                        <span style={{ fontSize: 15, flexShrink: 0, lineHeight: 1.4 }}>{ev.icon}</span>
                        <div>
                          <span style={{ fontSize: 10, color: c.accent, fontFamily: "monospace", marginRight: 4, fontWeight: 600 }}>{ev.time}</span>
                          <span style={{ fontSize: 12, color: ev.sug ? "#9a9488" : "#2a3040", fontFamily: "sans-serif", lineHeight: 1.4 }}>{ev.text}</span>
                          {ev.ref && <span style={{ fontSize: 10, color: "#7a90a8", fontFamily: "monospace", marginLeft: 4 }}>[{ev.ref}]</span>}
                          {ev.cal && <span style={{ fontSize: 9, background: "#dbeafe", color: "#1e40af", border: "1px solid #93c5fd", borderRadius: 4, padding: "1px 5px", marginLeft: 5, fontFamily: "sans-serif", letterSpacing: 0.5, verticalAlign: "middle" }}>📅 cal</span>}
                          {ev.sug && <span style={{ fontSize: 9, background: "#fef9c3", color: "#92400e", border: "1px solid #fde68a", borderRadius: 4, padding: "1px 5px", marginLeft: 5, fontFamily: "sans-serif", letterSpacing: 0.5, verticalAlign: "middle" }}>💡 idea</span>}
                        </div>
                      </div>
                    ))}
                    {!isOpen && day.events.length > 2 && (
                      <div style={{ fontSize: 11, color: c.accent, fontFamily: "sans-serif", marginTop: 4, letterSpacing: 1, fontWeight: 600 }}>
                        +{day.events.length - 2} more ›
                      </div>
                    )}
                  </div>

                  {/* Tip */}
                  {isOpen && (
                    <div style={{ marginTop: 12, padding: "8px 12px", background: c.badge + "88", borderLeft: `3px solid ${c.accent}`, borderRadius: "0 8px 8px 0", fontSize: 11, color: c.text, fontFamily: "sans-serif", lineHeight: 1.5 }}>
                      {day.tip}
                    </div>
                  )}

                  {/* Rain indicator */}
                  <div style={{ display: "flex", gap: 4, alignItems: "center", marginTop: 10 }}>
                    <span style={{ fontSize: 10, color: "#9aaabb", fontFamily: "sans-serif" }}>Rain:</span>
                    {["Low", "Medium", "High"].map(r => (
                      <div key={r} style={{ width: 18, height: 4, borderRadius: 2, background: wRain === r ? (r === "Low" ? "#16a34a" : r === "Medium" ? "#d97706" : "#dc2626") : "#dde4ec" }} />
                    ))}
                    <span style={{ fontSize: 10, color: "#6a7a8a", fontFamily: "sans-serif" }}>{wRain}</span>
                  </div>
                </div>
              );
            })}
          </div>

          {/* Weather strip */}
          <div style={{ maxWidth: 960, margin: "32px auto 0" }}>
            <div style={{ background: "#ffffff", border: "1px solid #dde4ec", borderRadius: 16, padding: "20px 24px", overflow: "hidden", boxShadow: "0 2px 8px rgba(0,0,0,0.06)" }}>
              <div style={{ fontSize: 11, letterSpacing: 4, color: "#8a9ab0", fontFamily: "sans-serif", textTransform: "uppercase", marginBottom: 16 }}>
                ☁ 10-Day Weather Overview — Perth & Margaret River
              </div>
              <div style={{ display: "flex", gap: 0, overflowX: "auto" }}>
                {trip.days.map((d, i) => {
                  const c    = phaseColors[d.phase];
                  const wxD  = wx?.[i];
                  const icon = wxD?.weatherIcon ?? d.weatherIcon;
                  const hi   = wxD?.high        ?? d.high;
                  const lo   = wxD?.low         ?? d.low;
                  const rain = wxD?.rain        ?? d.rain;
                  const wc   = weatherColors(wxD?.wmoCode ?? emojiCode(d.weatherIcon));
                  return (
                    <div key={i} style={{ flex: "1 0 80px", textAlign: "center", padding: "12px 6px", borderRight: i < trip.days.length - 1 ? "1px solid #e8ecf2" : "none", background: wc.bg, transition: "background 0.3s" }}>
                      <div style={{ fontSize: 10, color: "#6a7a8a", fontFamily: "sans-serif", marginBottom: 4, fontWeight: 600 }}>{d.date.split(",")[0]}</div>
                      <div style={{ fontSize: 22, marginBottom: 4 }}>{icon}</div>
                      <div style={{ fontSize: 13, fontWeight: 700, color: wc.hi, fontFamily: "sans-serif" }}>{hi}°</div>
                      <div style={{ fontSize: 11, color: wc.lo, fontFamily: "sans-serif" }}>{lo}°</div>
                      <div style={{ width: 6, height: 6, borderRadius: "50%", margin: "6px auto 0", background: rain === "Low" ? "#16a34a" : rain === "Medium" ? "#d97706" : "#dc2626" }} />
                    </div>
                  );
                })}
              </div>
              <div style={{ display: "flex", gap: 16, marginTop: 12, justifyContent: "flex-end" }}>
                {[["#16a34a", "Low rain"], ["#d97706", "Med rain"], ["#dc2626", "High rain"]].map(([col, label]) => (
                  <div key={label} style={{ display: "flex", gap: 5, alignItems: "center" }}>
                    <div style={{ width: 8, height: 8, borderRadius: "50%", background: col }} />
                    <span style={{ fontSize: 10, color: "#8a9aaa", fontFamily: "sans-serif" }}>{label}</span>
                  </div>
                ))}
              </div>
            </div>
          </div>

          {/* Badge legend */}
          <div style={{ display: "flex", gap: 16, justifyContent: "center", marginTop: 24, flexWrap: "wrap" }}>
            <div style={{ display: "flex", gap: 6, alignItems: "center" }}>
              <span style={{ fontSize: 9, background: "#dbeafe", color: "#1e40af", border: "1px solid #93c5fd", borderRadius: 4, padding: "2px 7px", fontFamily: "sans-serif", letterSpacing: 0.5 }}>📅 cal</span>
              <span style={{ fontSize: 11, color: "#6a7a8a", fontFamily: "sans-serif" }}>Confirmed calendar event</span>
            </div>
            <div style={{ display: "flex", gap: 6, alignItems: "center" }}>
              <span style={{ fontSize: 9, background: "#fef9c3", color: "#92400e", border: "1px solid #fde68a", borderRadius: 4, padding: "2px 7px", fontFamily: "sans-serif", letterSpacing: 0.5 }}>💡 idea</span>
              <span style={{ fontSize: 11, color: "#6a7a8a", fontFamily: "sans-serif" }}>Generic suggestion — not yet booked</span>
            </div>
          </div>

          {/* Footer */}
          <div style={{ textAlign: "center", marginTop: 20, fontSize: 11, color: "#9aaabb", fontFamily: "sans-serif", letterSpacing: 1 }}>
            {wx ? "🌐 Live forecast via Open-Meteo" : "⏳ Loading live weather…"} · Click any day card to expand · Have an amazing trip! 🌿
          </div>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById("root"));
    root.render(<App />);
  </script>
</body>
</html>
